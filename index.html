<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP-TECH 2K26 Admin</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.20.3/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4faff;color:#003366}

/* HEADER */
.header{
  background:#0077cc;color:white;text-align:center;
  padding:15px;font-weight:bold;font-size:18px;
}

/* SEARCH */
.controls{
  display:flex;gap:10px;padding:10px;
  flex-wrap:wrap;
}
.controls input,.controls select{
  flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;
}

/* SKELETON */
.skeleton{
  height:120px;
  background:linear-gradient(90deg,#eee,#ddd,#eee);
  border-radius:10px;
  animation:shimmer 1.2s infinite;
  margin-bottom:10px;
}
@keyframes shimmer{0%{background-position:-200px}100%{background-position:200px}}

/* CARDS */
.container{padding:10px}
.card{
  background:white;border-radius:12px;
  padding:12px;margin-bottom:12px;
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

.card h3{margin:0}
.badge{
  background:#0077cc;color:white;
  padding:3px 8px;border-radius:12px;font-size:12px
}
.card p{margin:3px 0;font-size:14px}

.card-buttons{
  display:flex;gap:8px;margin-top:8px
}
.btn{
  flex:1;padding:6px;border:none;border-radius:6px;
  background:#0077cc;color:white;cursor:pointer
}

/* DOWNLOAD */
.download{
  text-align:center;padding:20px;
  display:flex;gap:15px;justify-content:center;
  flex-wrap:wrap;
}
.download button{
  margin:5px;padding:12px 24px;border:none;
  border-radius:8px;background:#0077cc;color:white;
  font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 10px rgba(0,119,204,0.3);
  transition:all 0.3s ease;
  display:flex;align-items:center;gap:8px;
}
.download button:hover{
  background:#005fa3;
  transform:translateY(-2px);
  box-shadow:0 6px 15px rgba(0,119,204,0.4);
}
.download button:active{
  transform:translateY(0);
}
.download button i{
  font-size:18px;
}

/* MODAL */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  justify-content:center;align-items:center;
}
.modal img{max-width:90%;border-radius:10px}

/* MOBILE */
@media(max-width:600px){
  .card-buttons{flex-direction:column}
}
</style>
</head>

<body>
    <div id="alertBox" style="
position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:#0077cc;color:white;padding:12px 20px;border-radius:8px;
box-shadow:0 6px 15px rgba(0,0,0,0.2);display:none;z-index:9999;">
Download started...
</div>

<div class="header">MAP-TECH 2K26 Admin Dashboard</div>

<div class="controls">
  <input type="text" id="search" placeholder="Search name...">
  <select id="filter">
    <option value="">All Events</option>
    <option>Paper Presentation</option>
    <option>Poster Presentation</option>
    <option>Technical Quiz</option>
  </select>
</div>

<div class="container" id="list">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<div class="download">
  <button onclick="downloadExcel()"><i class="fas fa-file-excel"></i> Download Excel Report</button>
  <button onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF Report</button>
</div>

<div class="modal" id="modal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

let downloadingPDF = false;
function showAlert(msg){
  const box = document.getElementById("alertBox");
  box.innerText = msg;
  box.style.display = "block";
  setTimeout(()=> box.style.display="none", 2500);
}

/* ------------------ FIREBASE ------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyAjDdnn_0_K0iQkSCLd5RcgMrP-DOjrzzU",
  authDomain: "map-tech2k26.firebaseapp.com",
  projectId: "map-tech2k26",
  storageBucket: "map-tech2k26.appspot.com",
  messagingSenderId: "344931361614",
  appId: "1:344931361614:web:d8a3d1141bbf325e41341f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");
let allData = [];

/* ------------------ RENDER ------------------ */
function render(data){
  list.innerHTML = "";
  data.forEach(d=>{
    list.innerHTML += `
      <div class="card">
        <h3>${d.name || ''}</h3>
        <span class="badge">${d.event || ''}</span>
        <p><b>Institute:</b> ${d.institute || ''}</p>
        <p><b>Dept:</b> ${d.dept || ''}</p>
        <p><b>Phone:</b> ${d.phone || ''}</p>
        <p><b>Email:</b> ${d.email || ''}</p>

        <div class="card-buttons">
          <button class="btn" onclick="viewImg('${d.screenshot}')">View Payment</button>
          <button class="btn" style="background:#dc3545" onclick="deleteEntry('${d.id}','${d.name}')">Delete</button>
        </div>
      </div>
    `;
  });
}

/* ------------------ VIEW IMAGE ------------------ */
window.viewImg = (url)=>{
  document.getElementById("modalImg").src = url;
  document.getElementById("modal").style.display="flex";
};

/* ------------------ DELETE ------------------ */
window.deleteEntry = async (id,name)=>{
  if(confirm(`Delete registration of ${name}?`)){
    await deleteDoc(doc(db,"registrations",id));
    allData = allData.filter(d=>d.id!==id);
    render(allData);
  }
};

/* ------------------ FETCH DATA ------------------ */
const snap = await getDocs(collection(db,"registrations"));
snap.forEach(doc=> allData.push({id:doc.id,...doc.data()}));
render(allData);

/* ------------------ SEARCH ------------------ */
search.oninput = ()=>{
  render(allData.filter(d=>d.name?.toLowerCase().includes(search.value.toLowerCase())));
};

/* ------------------ FILTER ------------------ */
filter.onchange = ()=>{
  render(filter.value ? allData.filter(d=>d.event===filter.value) : allData);
};

/* ------------------ EXCEL EXPORT ------------------ */
window.downloadExcel = function () {
  if (!allData || !allData.length) return alert("No data");

  try {
    const wb = XLSX.utils.book_new();

    // Sheet 1 – Full Data
    const main = XLSX.utils.json_to_sheet(allData.map(d => ({
      Name: d.name || '',
      Institute: d.institute || '',
      Department: d.dept || '',
      Phone: d.phone || '',
      Email: d.email || '',
      Event: d.event || ''
    })));
    XLSX.utils.book_append_sheet(wb, main, "All Registrations");

    // Event Sheets (FIXED NAME)
    const events = [...new Set(allData.map(d => d.event))];
    events.forEach(ev => {
      const cleanName = (ev || "Event")
        .replace(/[:\\\/\?\*\[\]]/g, "")  // remove invalid chars
        .substring(0, 31);

      const ws = XLSX.utils.json_to_sheet(
        allData.filter(d => d.event === ev).map(d => ({
          Name: d.name || '',
          Phone: d.phone || '',
          Email: d.email || '',
          Institute: d.institute || ''
        }))
      );

      XLSX.utils.book_append_sheet(wb, ws, cleanName);
    });

    // Summary Sheet
    const summary = XLSX.utils.json_to_sheet(events.map(ev => ({
      Event: ev,
      Registrations: allData.filter(d => d.event === ev).length
    })));
    XLSX.utils.book_append_sheet(wb, summary, "Summary");

    XLSX.writeFile(wb, "MAP-TECH-2K26-Professional-Report.xlsx");

    if (typeof showAlert === "function") {
      showAlert("Excel download started 📊");
    }

  } catch (err) {
    console.error("Excel Export Error:", err);
    alert("Excel download failed.");
  }
};

/* ------------------ PDF EXPORT ------------------ */
window.downloadPDF = function () {
  if (downloadingPDF) return;
  if (!allData.length) return alert("No data");

  downloadingPDF = true;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','mm','a4');
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  let y = 20;

  // Cover Header
  doc.setFillColor(0,119,204);
  doc.rect(0,0,pageWidth,40,"F");

  doc.setTextColor(255,255,255);
  doc.setFontSize(24);
  doc.setFont("helvetica","bold");
  doc.text("MAP-TECH 2K26", pageWidth/2, 18, {align:"center"});

  doc.setFontSize(14);
  doc.setFont("helvetica","normal");
  doc.text("State Level Technical Event Report", pageWidth/2, 28, {align:"center"});

  y = 55;
  doc.setTextColor(0,0,0);

  // Summary
  doc.setFontSize(14);
  doc.setFont("helvetica","bold");
  doc.text("Summary", 15, y);
  y += 10;

  const events = [...new Set(allData.map(d=>d.event))];
  doc.setFontSize(11);
  doc.setFont("helvetica","normal");
  doc.text(`Total Registrations: ${allData.length}`, 20, y);
  y += 7;

  events.forEach(ev=>{
    const count = allData.filter(d=>d.event===ev).length;
    doc.text(`${ev}: ${count}`, 20, y);
    y += 7;
  });

  // Details Pages
  doc.addPage();
  y = 20;

  events.forEach(event=>{
    if (y > pageHeight - 30) { doc.addPage(); y = 20; }

    doc.setFillColor(0,119,204);
    doc.rect(10,y-6,pageWidth-20,10,"F");

    doc.setTextColor(255,255,255);
    doc.setFontSize(12);
    doc.setFont("helvetica","bold");
    doc.text(event, 15, y);

    y += 12;
    doc.setTextColor(0,0,0);

    const eventData = allData.filter(d=>d.event===event);

    eventData.forEach(d=>{
      if (y > pageHeight - 30) { doc.addPage(); y = 20; }

      doc.setFillColor(240,247,255);
      doc.rect(12,y-5,pageWidth-24,24,"F");

      doc.setFontSize(11);
      doc.setFont("helvetica","bold");
      doc.text(d.name, 18, y);

      doc.setFont("helvetica","normal");
      doc.setFontSize(10);
      doc.text(`Institute: ${d.institute}`, 18, y+6);
      doc.text(`Dept: ${d.dept}`, 18, y+11);
      doc.text(`Phone: ${d.phone}`, 18, y+16);

      y += 28;
    });

    y += 5;
  });

  // Table Page
  doc.addPage();
  doc.setFontSize(16);
  doc.setTextColor(0,119,204);
  doc.text("Complete Participant List", 15, 20);

  doc.setFontSize(10);
  let startY = 30;

  allData.forEach((d,i)=>{
    if(startY > pageHeight-15){
      doc.addPage();
      startY = 20;
    }

    doc.text(`${i+1}. ${d.name}`,15,startY);
    doc.text(d.event,70,startY);
    doc.text(d.phone,120,startY);
    startY += 7;
  });

  doc.save("MAP-TECH-2K26-Professional-Report.pdf");

  if (typeof showAlert === "function") {
    showAlert("PDF download started 📄");
  }

  setTimeout(()=> downloadingPDF = false, 2000);
};


</script>

</body>
</html>
