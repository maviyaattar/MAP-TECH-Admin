<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP-TECH Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f2f6fb;color:#1a2b3c}
.header{background:#0d6efd;color:white;text-align:center;padding:18px;font-weight:600;font-size:20px}
.controls{display:flex;gap:12px;padding:12px;flex-wrap:wrap}
.controls input,.controls select{flex:1;padding:12px;border-radius:10px;border:1px solid #d0d7e2;background:white}
.container{padding:12px}
.card{background:white;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,0.05)}
.badge{padding:4px 10px;border-radius:12px;font-size:12px;color:white}
.pending{background:#ffc107}
.verified{background:#28a745}
.rejected{background:#dc3545}
.card-buttons{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.view{background:#0d6efd;color:white}
.verify{background:#28a745;color:white}
.reject{background:#dc3545;color:white}
.pendingBtn{background:#ffc107;color:black}
.whatsapp{background:#25D366;color:white}
.download{padding:20px;text-align:center}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center}
.modal img{max-width:90%;max-height:90%;border-radius:10px}
</style>
</head>
<body>

<div class="header">MAP-TECH 2K26 Admin Dashboard</div>

<div class="controls">
  <input type="text" id="search" placeholder="Search name...">
  <select id="filterEvent">
    <option value="">All Events</option>
    <option>Paper Presentation</option>
    <option>Poster Presentation</option>
    <option>Technical Quiz</option>
  </select>
  <select id="downloadFilter">
    <option value="all">Download All</option>
    <option value="pending">Pending Only</option>
    <option value="verified">Verified Only</option>
    <option value="rejected">Rejected Only</option>
  </select>
</div>

<div class="container" id="list"></div>

<div class="download">
  <button onclick="downloadExcel()">Excel</button>
  <button onclick="downloadPDF()">PDF</button>
</div>

<div class="modal" id="imgModal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAjDdnn_0_K0iQkSCLd5RcgMrP-DOjrzzU",authDomain:"map-tech2k26.firebaseapp.com",projectId:"map-tech2k26"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let allData=[];
const list=document.getElementById("list");

/* LIVE */
onSnapshot(collection(db,"registrations"),snap=>{
  allData=[];
  snap.forEach(d=>allData.push({id:d.id,...d.data()}));
  applyFilters();
});

/* IMAGE MODAL */
window.showImg=(url)=>{
  modalImg.src=url;
  imgModal.style.display="flex";
};

/* STATUS CHANGE */
window.setStatus=async(id,status)=>{
  await updateDoc(doc(db,"registrations",id),{paymentStatus:status});
};

/* RENDER */
function render(data){
  list.innerHTML="";
  data.forEach(d=>{
    list.innerHTML+=`
    <div class="card">
      <h3>${d.name}</h3>
      <span class="badge ${d.paymentStatus||'pending'}">${d.paymentStatus||'pending'}</span>
      <p><b>Phone:</b> ${d.phone}</p>
      <p><b>Event:</b> ${d.event}</p>

      <div class="card-buttons">
        <button class="btn view" onclick="showImg('${d.paymentProofUrl}')">Proof</button>
        <button class="btn verify" onclick="setStatus('${d.id}','verified')">Verify</button>
        <button class="btn pendingBtn" onclick="setStatus('${d.id}','pending')">Pending</button>
        <button class="btn reject" onclick="setStatus('${d.id}','rejected')">Reject</button>
        ${d.paymentStatus==='verified'?`<button class="btn whatsapp" onclick="sendWA('${d.phone}','${d.name}')">WhatsApp</button>`:''}
      </div>
    </div>`;
  });
}

/* SEARCH + FILTER */
search.oninput=applyFilters;
filterEvent.onchange=applyFilters;

function applyFilters(){
  let data=allData.filter(d=>d.name.toLowerCase().includes(search.value.toLowerCase()));
  if(filterEvent.value) data=data.filter(d=>d.event===filterEvent.value);
  render(data);
}

/* WHATSAPP */
window.sendWA=(phone,name)=>{
  window.open(`https://wa.me/91${phone}?text=Hello ${name}, your MAP-TECH registration is verified.`, "_blank");
};

/* DOWNLOAD FILTERED DATA */
function getDownloadData(){
  const status=downloadFilter.value;
  if(status==='all') return allData;
  return allData.filter(d=>d.paymentStatus===status);
}
window.getDownloadData=getDownloadData;
</script>
</body>
</html>
