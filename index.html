<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP-TECH 2K26 Admin</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.20.3/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4faff;color:#003366}

/* HEADER */
.header{
  background:#0077cc;color:white;text-align:center;
  padding:15px;font-weight:bold;font-size:18px;
}

/* SEARCH */
.controls{
  display:flex;gap:10px;padding:10px;
  flex-wrap:wrap;
}
.controls input,.controls select{
  flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;
}

/* SKELETON */
.skeleton{
  height:120px;
  background:linear-gradient(90deg,#eee,#ddd,#eee);
  border-radius:10px;
  animation:shimmer 1.2s infinite;
  margin-bottom:10px;
}
@keyframes shimmer{0%{background-position:-200px}100%{background-position:200px}}

/* CARDS */
.container{padding:10px}
.card{
  background:white;border-radius:12px;
  padding:12px;margin-bottom:12px;
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

.card h3{margin:0}
.badge{
  background:#0077cc;color:white;
  padding:3px 8px;border-radius:12px;font-size:12px
}
.card p{margin:3px 0;font-size:14px}

.card-buttons{
  display:flex;gap:8px;margin-top:8px
}
.btn{
  flex:1;padding:6px;border:none;border-radius:6px;
  background:#0077cc;color:white;cursor:pointer
}

/* DOWNLOAD */
.download{
  text-align:center;padding:20px;
  display:flex;gap:15px;justify-content:center;
  flex-wrap:wrap;
}
.download button{
  margin:5px;padding:12px 24px;border:none;
  border-radius:8px;background:#0077cc;color:white;
  font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 10px rgba(0,119,204,0.3);
  transition:all 0.3s ease;
  display:flex;align-items:center;gap:8px;
}
.download button:hover{
  background:#005fa3;
  transform:translateY(-2px);
  box-shadow:0 6px 15px rgba(0,119,204,0.4);
}
.download button:active{
  transform:translateY(0);
}
.download button i{
  font-size:18px;
}

/* MODAL */
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  justify-content:center;align-items:center;
}
.modal img{max-width:90%;border-radius:10px}

/* MOBILE */
@media(max-width:600px){
  .card-buttons{flex-direction:column}
}
</style>
</head>

<body>

<div class="header">MAP-TECH 2K26 Admin Dashboard</div>

<div class="controls">
  <input type="text" id="search" placeholder="Search name...">
  <select id="filter">
    <option value="">All Events</option>
    <option>Paper Presentation</option>
    <option>Poster Presentation</option>
    <option>Technical Quiz</option>
  </select>
</div>

<div class="container" id="list">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<div class="download">
  <button onclick="downloadExcel()"><i class="fas fa-file-excel"></i> Download Excel Report</button>
  <button onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF Report</button>
</div>

<div class="modal" id="modal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjDdnn_0_K0iQkSCLd5RcgMrP-DOjrzzU",
  authDomain: "map-tech2k26.firebaseapp.com",
  projectId: "map-tech2k26",
  storageBucket: "map-tech2k26.appspot.com",
  messagingSenderId: "344931361614",
  appId: "1:344931361614:web:d8a3d1141bbf325e41341f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");
let allData=[];

function render(data){
  list.innerHTML="";
  data.forEach(d=>{
    // Sanitize all user inputs to prevent XSS
    const name = (d.name || '').replace(/[<>'"&]/g, c => ({'<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','&':'&amp;'}[c]));
    const event = (d.event || '').replace(/[<>'"&]/g, c => ({'<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','&':'&amp;'}[c]));
    const institute = (d.institute || '').replace(/[<>'"&]/g, c => ({'<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','&':'&amp;'}[c]));
    const dept = (d.dept || '').replace(/[<>'"&]/g, c => ({'<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','&':'&amp;'}[c]));
    const phone = (d.phone || '').replace(/[<>'"&]/g, c => ({'<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','&':'&amp;'}[c]));
    const email = (d.email || '').replace(/[<>'"&]/g, c => ({'<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','&':'&amp;'}[c]));
    const screenshot = (d.screenshot || '').replace(/['"]/g, c => ({'\'':'&#39;','"':'&quot;'}[c]));
    
    list.innerHTML+=`
      <div class="card" data-id="${d.id}">
        <h3>${name}</h3>
        <span class="badge">${event}</span>
        <p><b>Institute:</b> ${institute}</p>
        <p><b>Dept:</b> ${dept}</p>
        <p><b>Phone:</b> ${phone}</p>
        <p><b>Email:</b> ${email}</p>

        <div class="card-buttons">
          <button class="btn view-payment" data-screenshot="${screenshot}">View Payment</button>
          <button class="btn delete-entry" style="background:#dc3545" data-id="${d.id}" data-name="${name}">Delete</button>
        </div>
      </div>
    `;
  });
  
  // Add event listeners for delete buttons
  document.querySelectorAll('.delete-entry').forEach(btn=>{
    btn.addEventListener('click', function(){
      const id=this.getAttribute('data-id');
      const name=this.getAttribute('data-name');
      deleteEntry(id,name);
    });
  });
  
  // Add event listeners for view payment buttons
  document.querySelectorAll('.view-payment').forEach(btn=>{
    btn.addEventListener('click', function(){
      viewImg(this.getAttribute('data-screenshot'));
    });
  });
}

window.viewImg=url=>{
  modalImg.src=url;
  modal.style.display="flex";
};

window.deleteEntry=async(id,name)=>{
  if(confirm(`Are you sure you want to delete registration for ${name}?`)){
    try{
      await deleteDoc(doc(db,"registrations",id));
      allData=allData.filter(d=>d.id!==id);
      window.allData = allData; // Keep window.allData synchronized
      render(allData);
      alert("Registration deleted successfully!");
    }catch(err){
      console.error("Delete error:",err);
      alert("Failed to delete registration. Please try again.");
    }
  }
};

const snap=await getDocs(collection(db,"registrations"));
snap.forEach(doc=>allData.push({id:doc.id,...doc.data()}));
render(allData);

// SEARCH
search.oninput=()=>render(allData.filter(d=>d.name.toLowerCase().includes(search.value.toLowerCase())));

// FILTER
filter.onchange=()=>render(filter.value?allData.filter(d=>d.event===filter.value):allData);

// Expose allData to window for download functions
window.allData = allData;
</script>

<script>
// ENHANCED EXCEL with professional styling
window.downloadExcel=()=>{
  // Check if XLSX library is loaded
  if (typeof XLSX === 'undefined') {
    alert('Excel library is not loaded. Please check your internet connection and refresh the page.');
    console.error('XLSX library not loaded');
    return;
  }
  
  // Check if we have data
  if (!window.allData || window.allData.length === 0) {
    alert('No data available to export. Please wait for data to load or refresh the page.');
    console.error('No data available for export');
    return;
  }
  
  const wb=XLSX.utils.book_new();
  
  // Main sheet with all data
  const mainData=window.allData.map(d=>({
    Name:d.name,
    Institute:d.institute,
    Department:d.dept,
    Phone:d.phone,
    Email:d.email,
    Event:d.event
  }));
  
  const ws=XLSX.utils.json_to_sheet(mainData);
  
  // Set column widths
  ws['!cols']=[
    {wch:20},{wch:30},{wch:20},{wch:15},{wch:30},{wch:25}
  ];
  
  // Style header row
  const headerCells=['A1','B1','C1','D1','E1','F1'];
  headerCells.forEach(cell=>{
    if(ws[cell]){
      ws[cell].s={
        fill:{fgColor:{rgb:"0077CC"}},
        font:{bold:true,color:{rgb:"FFFFFF"},sz:12},
        alignment:{horizontal:"center",vertical:"center"}
      };
    }
  });
  
  // Add filters
  ws['!autofilter']={ref:`A1:F${mainData.length+1}`};
  
  XLSX.utils.book_append_sheet(wb,ws,"All Registrations");
  
  // Create sheets by event type
  const events=[...new Set(window.allData.map(d=>d.event))];
  events.forEach(event=>{
    const eventData=window.allData.filter(d=>d.event===event).map(d=>({
      Name:d.name,
      Institute:d.institute,
      Department:d.dept,
      Phone:d.phone,
      Email:d.email
    }));
    
    const eventWs=XLSX.utils.json_to_sheet(eventData);
    eventWs['!cols']=[{wch:20},{wch:30},{wch:20},{wch:15},{wch:30}];
    
    const eventHeaderCells=['A1','B1','C1','D1','E1'];
    eventHeaderCells.forEach(cell=>{
      if(eventWs[cell]){
        eventWs[cell].s={
          fill:{fgColor:{rgb:"0077CC"}},
          font:{bold:true,color:{rgb:"FFFFFF"},sz:12},
          alignment:{horizontal:"center",vertical:"center"}
        };
      }
    });
    
    eventWs['!autofilter']={ref:`A1:E${eventData.length+1}`};
    
    const safeName=event.substring(0,31).replace(/[:\\\/\?\*\[\]']/g,'');
    XLSX.utils.book_append_sheet(wb,eventWs,safeName);
  });
  
  // Summary statistics sheet
  const summaryData=events.map(event=>({
    Event:event,
    'Total Registrations':window.allData.filter(d=>d.event===event).length,
    'Unique Institutes':new Set(window.allData.filter(d=>d.event===event).map(d=>d.institute)).size
  }));
  
  summaryData.push({
    Event:'TOTAL',
    'Total Registrations':window.allData.length,
    'Unique Institutes':new Set(window.allData.map(d=>d.institute)).size
  });
  
  const summaryWs=XLSX.utils.json_to_sheet(summaryData);
  summaryWs['!cols']=[{wch:25},{wch:20},{wch:20}];
  
  const summaryHeaders=['A1','B1','C1'];
  summaryHeaders.forEach(cell=>{
    if(summaryWs[cell]){
      summaryWs[cell].s={
        fill:{fgColor:{rgb:"0077CC"}},
        font:{bold:true,color:{rgb:"FFFFFF"},sz:12},
        alignment:{horizontal:"center",vertical:"center"}
      };
    }
  });
  
  // Style total row
  const totalRowNum=summaryData.length+1;
  ['A','B','C'].forEach(col=>{
    const cell=col+totalRowNum;
    if(summaryWs[cell]){
      summaryWs[cell].s={
        fill:{fgColor:{rgb:"FFD966"}},
        font:{bold:true,sz:11},
        alignment:{horizontal:"center",vertical:"center"}
      };
    }
  });
  
  XLSX.utils.book_append_sheet(wb,summaryWs,"Summary");
  
  XLSX.writeFile(wb,"MAP-TECH-2K26-Registrations.xlsx");
};

// ENHANCED PDF with professional styling
window.downloadPDF=()=>{
  // Check if jsPDF library is loaded
  if (typeof window.jspdf === 'undefined') {
    alert('PDF library is not loaded. Please check your internet connection and refresh the page.');
    console.error('jsPDF library not loaded');
    return;
  }
  
  // Check if we have data
  if (!window.allData || window.allData.length === 0) {
    alert('No data available to export. Please wait for data to load or refresh the page.');
    console.error('No data available for export');
    return;
  }
  
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF('p','mm','a4');
  
  const pageWidth=doc.internal.pageSize.getWidth();
  const pageHeight=doc.internal.pageSize.getHeight();
  let yPos=20;
  
  // Helper function for new page
  const addNewPage=()=>{
    doc.addPage();
    yPos=20;
  };
  
  // Footer with page numbers
  const addFooter=()=>{
    const pageNum=doc.internal.getNumberOfPages();
    doc.setFontSize(9);
    doc.setTextColor(100);
    doc.text(`Page ${pageNum}`,pageWidth-30,pageHeight-10);
    doc.text('MAP-TECH 2K26',15,pageHeight-10);
  };
  
  // COVER PAGE
  doc.setFillColor(0,119,204);
  doc.rect(0,0,pageWidth,60,'F');
  
  doc.setTextColor(255,255,255);
  doc.setFontSize(28);
  doc.setFont('helvetica','bold');
  doc.text('MAP-TECH 2K26',pageWidth/2,30,{align:'center'});
  
  doc.setFontSize(16);
  doc.setFont('helvetica','normal');
  doc.text('Registration Report',pageWidth/2,45,{align:'center'});
  
  doc.setTextColor(0,0,0);
  doc.setFontSize(12);
  yPos=80;
  
  // Summary Section
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.setTextColor(0,119,204);
  doc.text('Summary Statistics',15,yPos);
  yPos+=10;
  
  doc.setFontSize(11);
  doc.setTextColor(0,0,0);
  doc.setFont('helvetica','normal');
  
  const events=[...new Set(window.allData.map(d=>d.event))];
  const totalRegs=window.allData.length;
  const totalInstitutes=new Set(window.allData.map(d=>d.institute)).size;
  
  doc.text(`Total Registrations: ${totalRegs}`,20,yPos);
  yPos+=7;
  doc.text(`Total Events: ${events.length}`,20,yPos);
  yPos+=7;
  doc.text(`Unique Institutes: ${totalInstitutes}`,20,yPos);
  yPos+=12;
  
  // Event breakdown
  doc.setFont('helvetica','bold');
  doc.text('Event Breakdown:',20,yPos);
  yPos+=7;
  
  doc.setFont('helvetica','normal');
  events.forEach(event=>{
    const count=window.allData.filter(d=>d.event===event).length;
    doc.text(`• ${event}: ${count} registrations`,25,yPos);
    yPos+=6;
  });
  
  // DETAILED REGISTRATIONS
  addNewPage();
  
  events.forEach((event,idx)=>{
    const eventData=window.allData.filter(d=>d.event===event);
    
    // Event Header
    doc.setFillColor(0,119,204);
    doc.rect(10,yPos-6,pageWidth-20,10,'F');
    
    doc.setTextColor(255,255,255);
    doc.setFontSize(13);
    doc.setFont('helvetica','bold');
    doc.text(event,15,yPos);
    yPos+=12;
    
    doc.setTextColor(0,0,0);
    doc.setFontSize(9);
    
    eventData.forEach((d,i)=>{
      // Check if we need a new page
      if(yPos>pageHeight-40){
        addNewPage();
        // Repeat event header on new page
        doc.setFillColor(0,119,204);
        doc.rect(10,yPos-6,pageWidth-20,10,'F');
        doc.setTextColor(255,255,255);
        doc.setFontSize(13);
        doc.setFont('helvetica','bold');
        doc.text(event+' (continued)',15,yPos);
        yPos+=12;
        doc.setTextColor(0,0,0);
        doc.setFontSize(9);
      }
      
      // Registration card
      doc.setFillColor(245,250,255);
      doc.rect(15,yPos-4,pageWidth-30,28,'F');
      
      doc.setDrawColor(0,119,204);
      doc.setLineWidth(0.5);
      doc.rect(15,yPos-4,pageWidth-30,28);
      
      doc.setFont('helvetica','bold');
      doc.setFontSize(11);
      doc.text(d.name,20,yPos+2);
      
      doc.setFont('helvetica','normal');
      doc.setFontSize(9);
      doc.text(`Institute: ${d.institute}`,20,yPos+8);
      doc.text(`Department: ${d.dept}`,20,yPos+13);
      doc.text(`Phone: ${d.phone}`,20,yPos+18);
      doc.text(`Email: ${d.email}`,20,yPos+23);
      
      yPos+=32;
    });
    
    yPos+=5;
    
    // Add page break between events if not last
    if(idx<events.length-1 && yPos>pageHeight-80){
      addNewPage();
    }
  });
  
  // Add footer to all pages
  const totalPages=doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPages;i++){
    doc.setPage(i);
    addFooter();
  }
  
  doc.save('MAP-TECH-2K26-Registrations.pdf');
};
</script>

</body>
</html>
